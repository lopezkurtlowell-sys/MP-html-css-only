<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MasterPeace International</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="login-screen">

    <div class="login-card">
        <h2>MasterPeace International</h2>
        <p class="quote">EMPOWERING LIVES, BUILDING KINGDOM, ADVANCING PEACE</p>
        
        <form action="editor-index.html">
            <div class="form-group">
                <label for="username">Email/Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Login as Editor</button>
        </form>

        <div class="divider">OR</div>

        <a href="index.html" class="btn btn-secondary" style="display:block; text-decoration:none;">Enter Site in Viewing Mode</a>
    </div>

</body>
</html>
